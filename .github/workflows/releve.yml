name: Relevé GameBanana

on:
  schedule:
    - cron: "37 3 * * *"    # relevé principal : 3h37 UTC (4h37 en hiver, 5h37 en été à Paris)
    - cron: "37 15 * * *"   # secours : 15h37 UTC (16h37 / 17h37) — ne fait rien si le matin a réussi
  workflow_dispatch:         # bouton « Run workflow » pour lancer un relevé à la main

permissions:
  contents: write   # enregistrer les nouveaux CSV dans le dépôt
  pages: write      # publier le tableau de bord
  id-token: write   # requis par GitHub Pages

concurrency:
  group: releve-gamebanana
  cancel-in-progress: false   # jamais deux relevés en même temps

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url || steps.deploiement2.outputs.page_url || steps.deploiement3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Relevé du jour
        id: releve
        continue-on-error: true   # même en cas d'échec, on enregistre et publie ce qui a été relevé
        env:
          PLANIFICATION: ${{ github.event.schedule }}
        run: |
          if [ "$PLANIFICATION" = "37 15 * * *" ]; then
            python gb_tracker.py secours
          else
            python gb_tracker.py
          fi

      - name: Enregistrer les données dans le dépôt
        run: |
          git config user.name "gb-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data config.json
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle."
          else
            git commit -m "Relevé du $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # La publication échoue parfois pour une raison passagère côté GitHub
      # (« No artifacts named github-pages were found... re-run later ») :
      # on réessaie deux fois, après 1 puis 3 minutes, avant de déclarer l'échec.
      - name: Publier le tableau de bord
        id: deploiement
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Attendre 1 min avant de réessayer la publication
        if: steps.deploiement.outcome == 'failure'
        run: sleep 60

      - name: Publier le tableau de bord (2e essai)
        id: deploiement2
        if: steps.deploiement.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Attendre 3 min avant le dernier essai
        if: steps.deploiement.outcome == 'failure' && steps.deploiement2.outcome == 'failure'
        run: sleep 180

      - name: Publier le tableau de bord (3e et dernier essai)
        id: deploiement3
        if: steps.deploiement.outcome == 'failure' && steps.deploiement2.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Signaler un relevé raté
        if: steps.releve.outcome == 'failure'
        run: |
          echo "::error::Le relevé a échoué (bloqué, hors ligne ou erreur) : voir les logs de l'étape « Relevé du jour »."
          exit 1
